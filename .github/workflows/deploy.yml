name: Build, Push to GHCR, & Deploy to Portainer

on:
  push:
    branches: ["master", "staging", "dev"]
  workflow_dispatch: 

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Otomatis masuk ke environment yang tepat di Github Settings
    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'Production' || github.ref == 'refs/heads/staging' && 'Staging' || 'Development' }}

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata then add auto tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/riaudevops/fe-tif-uin-suska
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            BASE_API_URL=${{ vars.BASE_API_URL != '' && vars.BASE_API_URL || secrets.BASE_API_URL }}
            HOST=${{ vars.HOST != '' && vars.HOST || '0.0.0.0' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- BAGIAN DEPLOY KE PORTAINER ---
      - name: Deploy ke Portainer
        env:
          B_USER: ${{ secrets.BASIC_AUTH_USER }}
          B_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          B_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }} # Cukup panggil 1 nama saja!
        run: |
          echo "🚀 Triggering Portainer Webhook..."
          curl -sS --fail -u "$B_USER:$B_PASS" -X POST "$B_URL"
          echo "✅ Deploy berhasil di-trigger!"