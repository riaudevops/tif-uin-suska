name: Build, Push to GHCR, & Deploy to Portainer

on:
  push:
    branches: ["master", "staging", "dev"]
    tags: ["v*", "*.*.*"]
  workflow_dispatch:

permissions:
  packages: write
  contents: read

concurrency:
  # One deploy at a time per ref. A tag push gets its own group so releasing a
  # version cannot cancel an in-flight branch deploy (and vice versa).
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Otomatis masuk ke environment yang tepat di Github Settings.
    # Tag push memakai environment Production agar bisa membawa
    # PORTAINER_WEBHOOK_URL_PROD (atau secrets khusus environment tersebut).
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/') && 'Production' || github.ref == 'refs/heads/master' && 'Production' || github.ref == 'refs/heads/staging' && 'Staging' || 'Development' }}

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      # --- QUALITY GATE (gagal cepat sebelum image dibangun) ---
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Verifikasi build
        run: bun run build
        env:
          BASE_API_URL: ${{ vars.BASE_API_URL != '' && vars.BASE_API_URL || secrets.BASE_API_URL }}
          PUBLIC_BASE_ASSETS_URL: ${{ vars.PUBLIC_BASE_ASSETS_URL != '' && vars.PUBLIC_BASE_ASSETS_URL || secrets.PUBLIC_BASE_ASSETS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
          HOST: ${{ vars.HOST != '' && vars.HOST || '0.0.0.0' }}

      - name: Security regression check
        run: bun run security:check
        env:
          BASE_API_URL: ${{ vars.BASE_API_URL != '' && vars.BASE_API_URL || secrets.BASE_API_URL }}
          PUBLIC_BASE_ASSETS_URL: ${{ vars.PUBLIC_BASE_ASSETS_URL != '' && vars.PUBLIC_BASE_ASSETS_URL || secrets.PUBLIC_BASE_ASSETS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
          HOST: 127.0.0.1

      # --- DOCKER IMAGE ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata then add auto tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/riaudevops/fe-tif-uin-suska
          # Git tag push  -> Docker tag persis mengikuti nama git tag (v1.2.3 -> v1.2.3)
          # Branch push   -> nama branch + sha, plus `latest` hanya untuk master
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            BASE_API_URL=${{ vars.BASE_API_URL != '' && vars.BASE_API_URL || secrets.BASE_API_URL }}
            PUBLIC_BASE_ASSETS_URL=${{ vars.PUBLIC_BASE_ASSETS_URL != '' && vars.PUBLIC_BASE_ASSETS_URL || secrets.PUBLIC_BASE_ASSETS_URL }}
            DIRECTUS_TOKEN=${{ secrets.DIRECTUS_TOKEN }}
            HOST=${{ vars.HOST != '' && vars.HOST || '0.0.0.0' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- BAGIAN DEPLOY KE PORTAINER ---
      - name: Deploy ke Portainer
        env:
          B_USER: ${{ secrets.BASIC_AUTH_USER }}
          B_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          # Git tag push dipisah ke stack produksi; branch push tetap memakai
          # webhook lama (staging/dev/master sesuai environment).
          B_URL: ${{ startsWith(github.ref, 'refs/tags/') && secrets.PORTAINER_WEBHOOK_URL_PROD || secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$B_URL" ]; then
            echo "::error::Webhook URL kosong. Untuk git tag, set PORTAINER_WEBHOOK_URL_PROD."
            exit 1
          fi
          echo "🚀 Triggering Portainer Webhook (${{ startsWith(github.ref, 'refs/tags/') && 'tag/production' || 'branch' }})..."
          curl -sS --fail --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
            -u "$B_USER:$B_PASS" -X POST "$B_URL"
          echo "✅ Deploy berhasil di-trigger!"